# Seed material property table for the selection engine.
#
# ⚠ PROVISIONAL. These are typical published values for generic grades, compiled as a starting
#   structure — not datasheet truth for any specific spool. Brand-to-brand variation within a
#   single family (especially PETG and "PLA+") is wide. Replace each value with numbers from the
#   datasheet of the filament you actually stock before this drives customer-facing quotes.
#
# Property notes:
#   hdt_045_c            heat deflection temperature at 0.45 MPa (°C)
#   elongation_pct       elongation at break, XY, as-printed
#   impact_notched       notched Izod, kJ/m²
#   z_strength_ratio     layer-adhesion strength as a fraction of XY tensile
#   creep_resistance     1-5, resistance to deformation under sustained load
#   uv_resistance        poor | fair | good | excellent
#   water_absorption_pct 24 h immersion, % by mass
#   printability         1-5 on a well-tuned machine (5 = forgiving)
#   warp                 low | medium | high
#   nozzle_c / bed_c     starting print temperatures; null for non-FDM processes
#   max_volumetric_mm3_s how fast the hotend can actually melt it on a 0.4 mm nozzle. This, not
#                        the machine's top speed, is what limits print time on a fast printer.
#   process_capability_mm nominal dimensional tolerance on a tuned machine
#   tolerance_floor_mm    tightest tolerance the process can be pushed to; below this, decline
#                         or escalate to another process rather than promise something you cannot hold
#   design               thresholds for the design feedback checks (worker/design.py). Set per
#                        process under process_defaults; a material may override any key with its
#                        own `design:` block, which is merged over the process defaults.

version: 0.4.0
process_defaults:
  fdm_04_nozzle:
    process_capability_mm: 0.20
    tolerance_floor_mm: 0.15
    min_feature_mm: 0.8
    design:
      # Extrusion width on a 0.4 mm nozzle. A wall thinner than one line cannot be laid down.
      min_wall_mm: 0.42
      # Every mainstream slicer generates support past 45 degrees from vertical by default, so
      # this is the line the customer's part is actually judged against.
      overhang_angle_deg: 45
      # Faces within this distance of the lowest point sit on the plate, not in mid-air. A
      # little over two 0.2 mm layers, so a slightly uneven bottom still counts as on the bed.
      bed_tolerance_mm: 0.6
      # Above this share of the surface needing support, support scarring and removal time
      # stop being incidental. Shop rule of thumb; calibrate from the job log.
      max_overhang_fraction: 0.4
      # Height over the square root of the footprint. Past about 4 a part needs a brim to stay
      # down on a fast CoreXY bed. Shop rule of thumb.
      max_aspect_ratio: 4.0
      # Above this a CAD export was almost certainly done at needless resolution. It slows
      # slicing; it does not change the print.
      max_triangles: 1500000
      # STL carries no units. A largest dimension under 5 mm, or ten times the build volume,
      # is far likelier to be inches or metres than a real part.
      units_min_dimension_mm: 5.0
      units_max_build_multiple: 10.0

      orientation:
        # How the six face-down candidates are traded off when strength does not decide it.
        # Each term is min-max normalised across the candidates, so these are relative weights.
        # Support dominates because it costs time, material, labour and surface finish at once.
        weights: { support: 0.45, bed_contact: 0.20, height: 0.10, time: 0.25 }
        # Support material is printed sparse. 12% matches the estimator in slicing.py.
        support_density: 0.12
        # Supports touching a face the customer marked cosmetic: anything above this much
        # area counts as marking it. A few mm2 is a stray triangle, not a scar.
        cosmetic_support_tolerance_mm2: 5.0
        # Below this bed contact the part relies on a brim to stay down. Roughly a 10 x 10 mm
        # pad; shop rule of thumb.
        min_bed_contact_mm2: 100.0

      load:
        # Load types that pull layer bonds apart when they cross the layers. Compression and
        # clamping press layers together instead, which is not the weak direction, so they do
        # not get to overrule the other orientation factors.
        applies_to: [tension, bending, shear, impact, cyclic]
        # When the customer gives no number, what their answer to "roughly how much load?" is
        # taken to mean. The intake options read: light = a few hundred grams, moderate = a few
        # kilograms, heavy = 20 kg or more. Unanswered is treated as moderate.
        assumed_load_n: { light: 5.0, moderate: 50.0, heavy: 200.0 }
        # Shock and fatigue raise the effective load well above the static figure. Common
        # first-pass design factors, not measurements.
        dynamic_factor: { impact: 2.0, cyclic: 1.5 }
        # Safety-factor bands on interlayer strength (tensile x z_strength_ratio). These are
        # bands, not a verdict: z_strength_ratio is provisional, so the customer sees only the
        # band and the operator sees the number.
        adequate_at_least: 2.0
        marginal_at_least: 1.0
        # The strongest orientation wins unless another is within this factor of it, in which
        # case the other orientation factors choose between them.
        strength_margin: 1.25
        # Sections are cut through the middle of the part only: the first and last few percent
        # are slivers that say more about the bed than about the load path.
        slices: 40
        slice_span: [0.05, 0.95]

      holes:
        # 4 pi A / P^2. A 64-facet circle is 0.998, a hexagon is 0.907; 0.95 keeps faceted
        # holes in and slots and polygons out.
        min_circularity: 0.95
        # Smaller than this cannot be printed as a hole at all; larger is a cut-out, not a
        # hole anyone will ream.
        min_diameter_mm: 1.0
        max_diameter_mm: 30.0
        # Vertical holes print undersize because each perimeter is a polygon inside the circle
        # and the plastic squashes inward. The effect is proportionally worst on small holes;
        # about 5 mm is where it starts to matter for a bolt or pin. Shop rule of thumb.
        vertical_undersize_below_mm: 5.0
        # What to add to a small vertical hole's diameter in CAD. Typical on a tuned 0.4 mm
        # nozzle; provisional, measure on your own machine.
        oversize_allowance_mm: 0.2
        # Horizontal holes up to this size print oval with a drooping top; above it the top
        # needs support or a teardrop shape.
        horizontal_bridge_mm: 8.0
        sections_per_axis: 9
  resin_msla:
    process_capability_mm: 0.05
    tolerance_floor_mm: 0.03
    min_feature_mm: 0.3

materials:

  - id: pla
    name: PLA
    process: fdm
    tensile_mpa: 55
    elongation_pct: 5
    impact_notched: 3
    hdt_045_c: 58
    z_strength_ratio: 0.55
    creep_resistance: 1
    uv_resistance: poor
    water_absorption_pct: 0.5
    attacked_by: [solvents, acids, bases]
    density_g_cm3: 1.24
    nozzle_c: 210
    bed_c: 60
    max_volumetric_mm3_s: 21
    cost_per_kg: 22
    printability: 5
    warp: low
    requires_enclosure: false
    requires_hardened_nozzle: false
    requires_drying: false
    food_safe_capable: false        # printed parts are not food safe regardless of resin grade
    notes: >
      Stiff, cheap, dimensionally excellent, best surface finish. Creeps badly under sustained
      load and softens in a hot car. Ideal for prototypes, fit checks, and cosmetic parts;
      wrong for almost anything structural or outdoors.

  - id: pla_tough
    name: Tough PLA / PLA+
    process: fdm
    tensile_mpa: 48
    elongation_pct: 15
    impact_notched: 8
    hdt_045_c: 60
    z_strength_ratio: 0.60
    creep_resistance: 2
    uv_resistance: poor
    water_absorption_pct: 0.5
    attacked_by: [solvents, acids, bases]
    density_g_cm3: 1.24
    nozzle_c: 220
    bed_c: 60
    max_volumetric_mm3_s: 18
    cost_per_kg: 28
    printability: 5
    warp: low
    requires_enclosure: false
    requires_hardened_nozzle: false
    requires_drying: false
    food_safe_capable: false
    notes: Same thermal ceiling as PLA but far less brittle. Good default for indoor light-duty parts.

  - id: petg
    name: PETG
    process: fdm
    tensile_mpa: 48
    elongation_pct: 18
    impact_notched: 8
    hdt_045_c: 72
    z_strength_ratio: 0.78
    creep_resistance: 3
    uv_resistance: fair
    water_absorption_pct: 0.3
    attacked_by: [solvents, acids]
    density_g_cm3: 1.27
    nozzle_c: 240
    bed_c: 80
    max_volumetric_mm3_s: 14
    cost_per_kg: 24
    printability: 4
    warp: low
    requires_enclosure: false
    requires_hardened_nozzle: false
    requires_drying: true
    food_safe_capable: false
    notes: >
      The workhorse. Excellent layer adhesion (best Z ratio of the common materials), tough,
      water-resistant, no enclosure needed. Stringy and poor at fine detail; mediocre UV life.
    design:
      holes:
        # PETG oozes into small holes; a slightly larger allowance than PLA.
        oversize_allowance_mm: 0.25

  - id: asa
    name: ASA
    process: fdm
    tensile_mpa: 44
    elongation_pct: 20
    impact_notched: 15
    hdt_045_c: 98
    z_strength_ratio: 0.58
    creep_resistance: 3
    uv_resistance: excellent
    water_absorption_pct: 0.4
    attacked_by: [solvents, fuels]
    density_g_cm3: 1.07
    nozzle_c: 260
    bed_c: 100
    max_volumetric_mm3_s: 16
    cost_per_kg: 32
    printability: 2
    warp: high
    requires_enclosure: true
    requires_hardened_nozzle: false
    requires_drying: true
    food_safe_capable: false
    notes: The outdoor answer. UV-stable, heat-tolerant, tough. Needs an enclosure and warps if rushed.

  - id: abs
    name: ABS
    process: fdm
    tensile_mpa: 42
    elongation_pct: 18
    impact_notched: 18
    hdt_045_c: 96
    z_strength_ratio: 0.55
    creep_resistance: 3
    uv_resistance: poor
    water_absorption_pct: 0.4
    attacked_by: [solvents, fuels]
    density_g_cm3: 1.04
    nozzle_c: 250
    bed_c: 100
    max_volumetric_mm3_s: 16
    cost_per_kg: 24
    printability: 2
    warp: high
    requires_enclosure: true
    requires_hardened_nozzle: false
    requires_drying: true
    food_safe_capable: false
    notes: Cheaper than ASA, acetone-smoothable, but yellows and embrittles in sunlight. Indoor heat duty only.

  - id: pc
    name: Polycarbonate
    process: fdm
    tensile_mpa: 65
    elongation_pct: 12
    impact_notched: 25
    hdt_045_c: 125
    z_strength_ratio: 0.62
    creep_resistance: 4
    uv_resistance: fair
    water_absorption_pct: 0.35
    attacked_by: [solvents, bases]
    density_g_cm3: 1.20
    nozzle_c: 280
    bed_c: 110
    max_volumetric_mm3_s: 12
    cost_per_kg: 48
    printability: 2
    warp: high
    requires_enclosure: true
    requires_hardened_nozzle: false
    requires_drying: true
    food_safe_capable: false
    notes: Strong and genuinely heat-tolerant. Very hygroscopic; a wet spool prints visibly foamy and weak.

  - id: pa6_cf
    name: PA6-CF (carbon-filled nylon)
    process: fdm
    tensile_mpa: 100
    elongation_pct: 4
    impact_notched: 9
    hdt_045_c: 160
    z_strength_ratio: 0.42
    creep_resistance: 4
    uv_resistance: fair
    water_absorption_pct: 1.8
    attacked_by: [acids]
    density_g_cm3: 1.18
    nozzle_c: 285
    bed_c: 100
    max_volumetric_mm3_s: 10
    cost_per_kg: 85
    printability: 2
    warp: medium
    requires_enclosure: true
    requires_hardened_nozzle: true
    requires_drying: true
    food_safe_capable: false
    notes: >
      Highest stiffness and heat resistance on the list. Severely anisotropic — orientation
      matters more than material choice here. Absorbs water fast; must be dried and kept dry.
    design:
      holes:
        # Filled nylon shrinks more than PLA or PETG as it cools.
        oversize_allowance_mm: 0.3

  - id: pa12
    name: PA12 (nylon)
    process: fdm
    tensile_mpa: 48
    elongation_pct: 30
    impact_notched: 12
    hdt_045_c: 95
    z_strength_ratio: 0.68
    creep_resistance: 3
    uv_resistance: fair
    water_absorption_pct: 0.9
    attacked_by: [acids]
    density_g_cm3: 1.01
    nozzle_c: 260
    bed_c: 90
    max_volumetric_mm3_s: 12
    cost_per_kg: 60
    printability: 2
    warp: medium
    requires_enclosure: true
    requires_hardened_nozzle: false
    requires_drying: true
    food_safe_capable: false
    notes: Tough, wear-resistant, self-lubricating. Gears, living hinges, snap fits. Swells when wet.
    design:
      holes:
        # Nylon shrinks more than PLA or PETG as it cools.
        oversize_allowance_mm: 0.3

  - id: pp
    name: Polypropylene
    process: fdm
    tensile_mpa: 28
    elongation_pct: 200
    impact_notched: 12
    hdt_045_c: 90
    z_strength_ratio: 0.70
    creep_resistance: 2
    uv_resistance: poor
    water_absorption_pct: 0.02
    attacked_by: []
    density_g_cm3: 0.90
    nozzle_c: 235
    bed_c: 90
    max_volumetric_mm3_s: 10
    cost_per_kg: 55
    printability: 1
    warp: high
    requires_enclosure: true
    requires_hardened_nozzle: false
    requires_drying: false
    food_safe_capable: true
    notes: >
      Unmatched chemical resistance and true living hinges. Notoriously hard to stick to a bed
      (needs PP-specific surface). Only worth offering when chemical resistance is the requirement.

  - id: tpu_95a
    name: TPU 95A
    process: fdm
    tensile_mpa: 35
    elongation_pct: 500
    impact_notched: null            # does not break in notched Izod
    hdt_045_c: 60
    z_strength_ratio: 0.90
    creep_resistance: 2
    uv_resistance: fair
    water_absorption_pct: 0.6
    attacked_by: [solvents, fuels]
    density_g_cm3: 1.21
    nozzle_c: 225
    bed_c: 50
    max_volumetric_mm3_s: 4
    cost_per_kg: 38
    printability: 3
    warp: low
    requires_enclosure: false
    requires_hardened_nozzle: false
    requires_drying: true
    food_safe_capable: false
    notes: Flexible, near-isotropic, effectively unbreakable. Slow to print; poor dimensional precision.
    design:
      # A flexible wall under one or two lines flexes during printing and comes out ragged.
      min_wall_mm: 0.8
      # Soft filament sags further on an overhang than a rigid one.
      overhang_angle_deg: 40
      holes:
        # TPU is printed slowly and squashes more, so holes close up further.
        oversize_allowance_mm: 0.4

  - id: resin_standard
    name: Standard photopolymer resin
    process: resin_msla
    tensile_mpa: 50
    elongation_pct: 7
    impact_notched: 2
    hdt_045_c: 65
    z_strength_ratio: 0.95
    creep_resistance: 2
    uv_resistance: poor            # continues curing and embrittles in sunlight
    water_absorption_pct: 0.5
    attacked_by: [solvents, alcohols]
    density_g_cm3: 1.15
    nozzle_c: null
    bed_c: null
    max_volumetric_mm3_s: null
    cost_per_kg: 45
    printability: 3
    warp: low
    requires_enclosure: false
    requires_hardened_nozzle: false
    requires_drying: false
    food_safe_capable: false
    notes: >
      Detail and surface finish nothing FDM can match, and near-isotropic. Brittle, creeps, and
      degrades outdoors. Display and fit-detail parts only, never sustained-load functional parts.

  - id: resin_tough
    name: Tough / ABS-like resin
    process: resin_msla
    tensile_mpa: 45
    elongation_pct: 20
    impact_notched: 5
    hdt_045_c: 70
    z_strength_ratio: 0.95
    creep_resistance: 2
    uv_resistance: poor
    water_absorption_pct: 0.6
    attacked_by: [solvents, alcohols]
    density_g_cm3: 1.15
    nozzle_c: null
    bed_c: null
    max_volumetric_mm3_s: null
    cost_per_kg: 65
    printability: 3
    warp: low
    requires_enclosure: false
    requires_hardened_nozzle: false
    requires_drying: false
    food_safe_capable: false
    notes: Fine detail with usable ductility. Still creeps under sustained load; still not for outdoors.
