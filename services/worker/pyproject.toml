[project]
name = "printshop-worker"
version = "0.1.0"
description = "Geometry analysis, material selection, slicing and quoting for the 3D printing service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "trimesh>=4.5",
    "rtree>=1.3",              # required by trimesh's ray intersector for wall-thickness sampling
    "numpy>=1.26",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom is a function call in an argument default.
"src/worker/api.py" = ["B008"]
